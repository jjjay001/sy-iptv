
name: update-lives-list

on:
  schedule:
    - cron: '0 20 * * *'
  push:
    branches:
      - main
    paths:
      - 'fetch_streams.py'
      - '.github/workflows/update-lives-list.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-lives-list
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      # 1. 拉取仓库
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. 配置 Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 3. 安装依赖
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install selenium requests futures eventlet beautifulsoup4

      # 4. 测试主站 DNS
      - name: Test SNRTV DNS
        continue-on-error: true
        run: |
          echo "========== 主站 DNS =========="
          nslookup m.snrtv.com

          echo ""
          echo "========== CDN DNS =========="
          nslookup res.cnwest.com || true

      # 5. 测试主站 HTTP 和 HTTPS
      - name: Test SNRTV HTTP and HTTPS
        continue-on-error: true
        run: |
          echo "========== HTTP 测试 =========="

          curl -4 -L -sS \
            --connect-timeout 15 \
            --max-time 30 \
            "http://m.snrtv.com/snrtv_tv/index.html" \
            -o /tmp/http.html \
            -w "\nHTTP状态码: %{http_code}\n连接时间: %{time_connect}\n总时间: %{time_total}\n" || true

          echo ""
          echo "========== HTTPS 测试 =========="

          curl -4 -L -sS \
            --connect-timeout 15 \
            --max-time 30 \
            "https://m.snrtv.com/snrtv_tv/index.html" \
            -o /tmp/https.html \
            -w "\nHTTPS状态码: %{http_code}\n连接时间: %{time_connect}\n总时间: %{time_total}\n" || true

          echo ""
          echo "========== 下载文件检查 =========="
          ls -lh /tmp/http.html /tmp/https.html 2>/dev/null || true

      # 6. 逐个测试主站 IP
      - name: Test SNRTV IP connectivity
        continue-on-error: true
        run: |
          echo "========== 逐个测试主站 IP =========="

          for ip in \
            59.108.133.175 \
            59.108.133.171 \
            59.108.133.176 \
            59.108.133.177 \
            59.108.133.174 \
            59.108.133.172 \
            59.108.133.179 \
            59.108.133.173
          do
            echo ""
            echo "========== 测试 $ip =========="

            curl -4 -sS \
              --connect-timeout 8 \
              --max-time 12 \
              --resolve "m.snrtv.com:80:$ip" \
              "http://m.snrtv.com/snrtv_tv/index.html" \
              -o /dev/null \
              -w "HTTP: %{http_code} 连接: %{time_connect}s 总耗时: %{time_total}s\n" \
              || true
          done

      # 7. 测试静态资源 CDN 网络
      - name: Test SNRTV CDN connection
        continue-on-error: true
        run: |
          CDN_URL="http://res.cnwest.com/t/site/10001/a209bcf3e52b0593bd2c51ae47c9d6ab/assets/snrtv2020/js/EmperorNewClothes.js"

          echo "========== CDN DNS =========="
          nslookup res.cnwest.com || true

          echo ""
          echo "========== CDN IPv4 HTTP =========="

          curl -4 -v -L \
            --connect-timeout 15 \
            --max-time 30 \
            -A "Mozilla/5.0" \
            "$CDN_URL" \
            -o /tmp/cdn_test.js \
            -w "\nHTTP状态码: %{http_code}\n连接时间: %{time_connect}\n总时间: %{time_total}\n下载大小: %{size_download}\n" || true

          echo ""
          echo "========== CDN HTTPS =========="

          curl -4 -v -L \
            --connect-timeout 15 \
            --max-time 30 \
            -A "Mozilla/5.0" \
            "${CDN_URL/http:/https:}" \
            -o /tmp/cdn_test_https.js \
            -w "\nHTTPS状态码: %{http_code}\n连接时间: %{time_connect}\n总时间: %{time_total}\n下载大小: %{size_download}\n" || true

          echo ""
          echo "========== CDN 下载文件 =========="
          ls -lh /tmp/cdn_test* 2>/dev/null || true

          if [ -s /tmp/cdn_test.js ]; then
            echo ""
            echo "========== JS 文件前 20 行 =========="
            head -20 /tmp/cdn_test.js
          fi

      # 8. 下载并检查网页 JS 文件
      - name: Inspect SNRTV JavaScript
        continue-on-error: true
        run: |
          BASE="http://res.cnwest.com/t/site/10001/a209bcf3e52b0593bd2c51ae47c9d6ab/assets"

          mkdir -p /tmp/snrtv_js

          echo "========== 下载 JS 文件 =========="

          for item in \
            "snrtv2020/js/EmperorNewClothes.js" \
            "snrtv2020/js/dress.js" \
            "snrtv2020/js/Event.js" \
            "snrtv2020/js/programGuides.js" \
            "public2018/js/zepto.min.js" \
            "sxtvs2020/js/swiper.min.4.5.3.js"
          do
            filename=$(basename "$item")

            echo ""
            echo "========== $filename =========="

            curl -4 -L -sS \
              --connect-timeout 15 \
              --max-time 30 \
              -A "Mozilla/5.0" \
              "$BASE/$item" \
              -o "/tmp/snrtv_js/$filename" \
              -w "HTTP状态码: %{http_code}\n连接时间: %{time_connect}\n总时间: %{time_total}\n下载大小: %{size_download}\n" || true

            if [ -s "/tmp/snrtv_js/$filename" ]; then
              wc -c "/tmp/snrtv_js/$filename"
            else
              echo "文件下载失败或为空"
            fi
          done

          echo ""
          echo "========== 搜索频道及接口关键词 =========="

          grep -Ein \
            'ajax|api|json|channel|channelName|channelId|live|m3u8|mp4|videoBox|play|tvList|tvlist|source|url:' \
            /tmp/snrtv_js/*.js 2>/dev/null | head -200 || true

          echo ""
          echo "========== 搜索接口地址 =========="

          grep -Eo \
            'https?://[^" )]+' \
            /tmp/snrtv_js/*.js 2>/dev/null | sort -u | head -100 || true

      # 9. 检查网页 HTML
      - name: Inspect SNRTV HTML
        continue-on-error: true
        run: |
          echo "========== 页面标题 =========="
          grep -o '<title>[^<]*</title>' /tmp/http.html 2>/dev/null || true

          echo ""
          echo "========== 频道容器 =========="
          grep -Ein \
            'channelName|channelCur|videoBox|channel|m3u8|ajax' \
            /tmp/http.html 2>/dev/null | head -100 || true

          echo ""
          echo "========== 页面脚本 =========="
          grep -Ein \
            'script|channel|m3u8|ajax|api|json' \
            /tmp/http.html 2>/dev/null | tail -100 || true

          echo ""
          echo "========== HTML 文件大小 =========="
          wc -c /tmp/http.html 2>/dev/null || true

      # 10. 分析陕西广电频道数据
      - name: Analyze SNRTV channel data
        continue-on-error: true
        run: |
          echo "========== 网页内嵌配置 130-185 行 =========="
          sed -n '130,185p' /tmp/http.html 2>/dev/null || true

          echo ""
          echo "========== sTV / sRadio 变量检查 =========="

          if [ -s /tmp/http.html ]; then
            grep -nE 'sTV|sRadio' /tmp/http.html | head -30 || true
          else
            echo "主页文件不存在或为空"
          fi

          echo ""
          echo "========== EmperorNewClothes.js =========="
          cat /tmp/snrtv_js/EmperorNewClothes.js 2>/dev/null || true

          echo ""
          echo "========== dress.js =========="
          cat /tmp/snrtv_js/dress.js 2>/dev/null || true

          echo ""
          echo "========== programGuides.js =========="
          sed -n '1,280p' /tmp/snrtv_js/programGuides.js 2>/dev/null || true

          echo ""
          echo "========== 频道数据关键变量 =========="
          grep -nE \
            'sTV|sRadio|videoHashMap|radioHashMap|Undress|loadScript|snr_Playlist|curPlaylist' \
            /tmp/http.html \
            /tmp/snrtv_js/*.js 2>/dev/null || true

      # 11. 执行原有抓取程序
      - name: Run fetch_stream
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 10
          max_attempts: 10
          retry_wait_seconds: 1800
          command: python ${{ github.workspace }}/fetch_streams.py

      # 12. 检查 M3U 文件
      - name: Check M3U file
        if: always()
        run: |
          echo "========== M3U 文件检查 =========="

          if [ -s ShaanxiTV.m3u ]; then
            echo "M3U 文件存在"
            wc -l ShaanxiTV.m3u
            head -20 ShaanxiTV.m3u
          else
            echo "警告：ShaanxiTV.m3u 不存在或为空"
          fi

      # 13. 提交 M3U 文件
      - name: Commit M3U file
        if: success()
        run: |
          git config --global user.email "315723172@qq.com"
          git config --global user.name "jjjay001"

          git pull --rebase origin main

          git add ShaanxiTV.m3u

          git commit -m "更新陕西广电直播源" || echo "No changes to commit"

          git push origin main
