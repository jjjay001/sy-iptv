
name: update-lives-list

on:
  schedule:
    - cron: '0 20 * * *'
  push:
    branches:
      - main
    paths:
      - 'fetch_streams.py'
      - '.github/workflows/update-lives-list.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-lives-list
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      # 1. 拉取仓库
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. 配置 Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 3. 安装依赖
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install selenium requests futures eventlet beautifulsoup4

      # 4. 测试主站 DNS
      - name: Test SNRTV DNS
        continue-on-error: true
        run: |
          echo "========== 主站 DNS =========="
          nslookup m.snrtv.com || true

          echo ""
          echo "========== CDN DNS =========="
          nslookup res.cnwest.com || true

          echo ""
          echo "========== 起点新闻 API DNS =========="
          nslookup qidian.sxtvs.com || true

          echo ""
          echo "========== 直播 CDN DNS =========="
          nslookup stream.snrtv.com || true

      # 5. 测试主站 HTTP 和 HTTPS
      - name: Test SNRTV HTTP and HTTPS
        continue-on-error: true
        run: |
          echo "========== HTTP 测试 =========="

          curl -4 -L -sS \
            --connect-timeout 15 \
            --max-time 30 \
            "http://m.snrtv.com/snrtv_tv/index.html" \
            -o /tmp/http.html \
            -w "\nHTTP状态码: %{http_code}\n连接时间: %{time_connect}\n总时间: %{time_total}\n" || true

          echo ""
          echo "========== HTTPS 测试 =========="

          curl -4 -L -sS \
            --connect-timeout 15 \
            --max-time 30 \
            "https://m.snrtv.com/snrtv_tv/index.html" \
            -o /tmp/https.html \
            -w "\nHTTPS状态码: %{http_code}\n连接时间: %{time_connect}\n总时间: %{time_total}\n" || true

          echo ""
          echo "========== 下载文件检查 =========="
          ls -lh /tmp/http.html /tmp/https.html 2>/dev/null || true

      # 6. 逐个测试主站 IP
      - name: Test SNRTV IP connectivity
        continue-on-error: true
        run: |
          echo "========== 逐个测试主站 IP =========="

          for ip in \
            59.108.133.175 \
            59.108.133.171 \
            59.108.133.176 \
            59.108.133.177 \
            59.108.133.174 \
            59.108.133.172 \
            59.108.133.179 \
            59.108.133.173
          do
            echo ""
            echo "========== 测试 $ip =========="

            curl -4 -sS \
              --connect-timeout 8 \
              --max-time 12 \
              --resolve "m.snrtv.com:80:$ip" \
              "http://m.snrtv.com/snrtv_tv/index.html" \
              -o /dev/null \
              -w "HTTP: %{http_code} 连接: %{time_connect}s 总耗时: %{time_total}s\n" \
              || true
          done

      # 7. 测试静态资源 CDN 网络
      - name: Test SNRTV CDN connection
        continue-on-error: true
        run: |
          CDN_URL="http://res.cnwest.com/t/site/10001/a209bcf3e52b0593bd2c51ae47c9d6ab/assets/snrtv2020/js/EmperorNewClothes.js"

          echo "========== CDN DNS =========="
          nslookup res.cnwest.com || true

          echo ""
          echo "========== CDN IPv4 HTTP =========="

          curl -4 -v -L \
            --connect-timeout 15 \
            --max-time 30 \
            -A "Mozilla/5.0" \
            "$CDN_URL" \
            -o /tmp/cdn_test.js \
            -w "\nHTTP状态码: %{http_code}\n连接时间: %{time_connect}\n总时间: %{time_total}\n下载大小: %{size_download}\n" || true

          echo ""
          echo "========== CDN HTTPS =========="

          curl -4 -v -L \
            --connect-timeout 15 \
            --max-time 30 \
            -A "Mozilla/5.0" \
            "${CDN_URL/http:/https:}" \
            -o /tmp/cdn_test_https.js \
            -w "\nHTTPS状态码: %{http_code}\n连接时间: %{time_connect}\n总时间: %{time_total}\n下载大小: %{size_download}\n" || true

          echo ""
          echo "========== CDN 下载文件 =========="
          ls -lh /tmp/cdn_test* 2>/dev/null || true

          if [ -s /tmp/cdn_test.js ]; then
            echo ""
            echo "========== JS 文件前 20 行 =========="
            head -20 /tmp/cdn_test.js
          fi

      # 8. 下载并检查网页 JS 文件
      - name: Inspect SNRTV JavaScript
        continue-on-error: true
        run: |
          BASE="http://res.cnwest.com/t/site/10001/a209bcf3e52b0593bd2c51ae47c9d6ab/assets"

          mkdir -p /tmp/snrtv_js

          echo "========== 下载 JS 文件 =========="

          for item in \
            "snrtv2020/js/EmperorNewClothes.js" \
            "snrtv2020/js/dress.js" \
            "snrtv2020/js/Event.js" \
            "snrtv2020/js/programGuides.js" \
            "public2018/js/zepto.min.js" \
            "sxtvs2020/js/swiper.min.4.5.3.js"
          do
            filename=$(basename "$item")

            echo ""
            echo "========== $filename =========="

            curl -4 -L -sS \
              --connect-timeout 15 \
              --max-time 30 \
              -A "Mozilla/5.0" \
              "$BASE/$item" \
              -o "/tmp/snrtv_js/$filename" \
              -w "HTTP状态码: %{http_code}\n连接时间: %{time_connect}\n总时间: %{time_total}\n下载大小: %{size_download}\n" || true

            if [ -s "/tmp/snrtv_js/$filename" ]; then
              wc -c "/tmp/snrtv_js/$filename"
            else
              echo "文件下载失败或为空"
            fi
          done

          echo ""
          echo "========== 搜索频道及接口关键词 =========="

          grep -Ein \
            'ajax|api|json|channel|channelName|channelId|live|m3u8|mp4|videoBox|play|tvList|tvlist|source|url:' \
            /tmp/snrtv_js/*.js 2>/dev/null | head -200 || true

          echo ""
          echo "========== 搜索接口地址 =========="

          grep -Eo \
            'https?://[^" )]+' \
            /tmp/snrtv_js/*.js 2>/dev/null | sort -u | head -100 || true

      # 9. 测试起点新闻 API
      - name: Test Qidian TV API
        continue-on-error: true
        run: |
          mkdir -p /tmp/qidian_api

          echo "========== 测试起点新闻电视节目 API =========="

          for channel in star nl 1 2 3 5 7 11
          do
            echo ""
            echo "========== channel=$channel =========="

            curl -4 -L -sS \
              --connect-timeout 10 \
              --max-time 20 \
              -A "Mozilla/5.0" \
              -H "Referer: http://m.snrtv.com/snrtv_tv/index.html" \
              "https://qidian.sxtvs.com/api/v3/program/tv?channel=$channel" \
              -D "/tmp/qidian_api/header_$channel.txt" \
              -o "/tmp/qidian_api/$channel.txt" \
              -w "HTTP=%{http_code} CONNECT=%{time_connect}s TOTAL=%{time_total}s SIZE=%{size_download}\n" \
              || true

            echo "--- 响应头 ---"
            head -n 8 "/tmp/qidian_api/header_$channel.txt" 2>/dev/null || true

            echo "--- 返回内容前500字符 ---"
            head -c 500 "/tmp/qidian_api/$channel.txt" 2>/dev/null || true

            echo ""
          done

      # 10. 测试直播流 CDN
      - name: Test SNRTV Live Stream
        continue-on-error: true
        run: |
          echo "========== 测试已知新闻资讯直播流 =========="

          STREAM_URL="http://stream.snrtv.com/sxbc-1-ejkmt9.m3u8"

          echo ""
          echo "========== HTTP 测试 =========="

          curl -4 -L -sS \
            --connect-timeout 10 \
            --max-time 20 \
            -A "Mozilla/5.0" \
            "$STREAM_URL" \
            -o /tmp/test_stream_http.txt \
            -w "HTTP=%{http_code} CONNECT=%{time_connect}s TOTAL=%{time_total}s SIZE=%{size_download}\n" \
            || true

          echo ""
          echo "========== HTTPS 测试 =========="

          curl -4 -L -sS \
            --connect-timeout 10 \
            --max-time 20 \
            -A "Mozilla/5.0" \
            "${STREAM_URL/http:/https:}" \
            -o /tmp/test_stream_https.txt \
            -w "HTTP=%{http_code} CONNECT=%{time_connect}s TOTAL=%{time_total}s SIZE=%{size_download}\n" \
            || true

          echo ""
          echo "========== HTTP 返回内容 =========="
          head -c 1000 /tmp/test_stream_http.txt 2>/dev/null || true

          echo ""
          echo "========== HTTPS 返回内容 =========="
          head -c 1000 /tmp/test_stream_https.txt 2>/dev/null || true

      # 11. 检查网页 HTML
      - name: Inspect SNRTV HTML
        continue-on-error: true
        run: |
          echo "========== 页面标题 =========="
          grep -o '<title>[^<]*</title>' /tmp/http.html 2>/dev/null || true

          echo ""
          echo "========== 频道容器 =========="
          grep -Ein \
            'channelName|channelCur|videoBox|channel|m3u8|ajax' \
            /tmp/http.html 2>/dev/null | head -100 || true

          echo ""
          echo "========== 页面脚本 =========="
          grep -Ein \
            'script|channel|m3u8|ajax|api|json' \
            /tmp/http.html 2>/dev/null | tail -100 || true

          echo ""
          echo "========== HTML 文件大小 =========="
          wc -c /tmp/http.html 2>/dev/null || true

      # 12. 分析陕西广电频道数据
      - name: Analyze SNRTV channel data
        continue-on-error: true
        run: |
          echo "========== 网页内嵌配置 130-185 行 =========="
          sed -n '130,185p' /tmp/http.html 2>/dev/null || true

          echo ""
          echo "========== sTV / sRadio 变量检查 =========="

          grep -nE 'sTV|sRadio' /tmp/http.html 2>/dev/null | head -30 || true

          echo ""
          echo "========== EmperorNewClothes.js =========="
          cat /tmp/snrtv_js/EmperorNewClothes.js 2>/dev/null || true

          echo ""
          echo "========== dress.js =========="
          cat /tmp/snrtv_js/dress.js 2>/dev/null || true

          echo ""
          echo "========== programGuides.js =========="
          sed -n '1,280p' /tmp/snrtv_js/programGuides.js 2>/dev/null || true

          echo ""
          echo "========== 频道数据关键变量 =========="
          grep -nE \
            'sTV|sRadio|videoHashMap|radioHashMap|Undress|loadScript|snr_Playlist|curPlaylist' \
            /tmp/http.html \
            /tmp/snrtv_js/*.js 2>/dev/null || true

      # 13. 新增：定位 sTV 和 sRadio 的来源
      - name: Find sTV and sRadio source
        continue-on-error: true
        run: |
          mkdir -p /tmp/snrtv_js/linked

          echo "========== 从 HTML 提取 script 地址并下载 =========="

          python - <<'PY'
          import os
          import re
          import requests
          from urllib.parse import urljoin, urlparse

          html_path = "/tmp/http.html"
          save_dir = "/tmp/snrtv_js/linked"
          os.makedirs(save_dir, exist_ok=True)

          if not os.path.isfile(html_path):
              print("HTML 文件不存在")
              raise SystemExit(0)

          html = open(html_path, encoding="utf-8", errors="ignore").read()

          urls = re.findall(
              r'<script[^>]+src\s*=\s*["\']([^"\']+)',
              html,
              re.I
          )

          print("发现 script 数量:", len(urls))

          session = requests.Session()
          session.headers.update({
              "User-Agent": "Mozilla/5.0",
              "Referer": "http://m.snrtv.com/snrtv_tv/index.html"
          })

          for src in urls:
              url = urljoin(
                  "http://m.snrtv.com/snrtv_tv/index.html",
                  src
              )

              if not url.lower().split("?")[0].endswith(".js"):
                  continue

              name = os.path.basename(urlparse(url).path)
              if not name:
                  continue

              path = os.path.join(save_dir, name)

              try:
                  r = session.get(url, timeout=20)
                  print(
                      "JS:", url,
                      "HTTP:", r.status_code,
                      "SIZE:", len(r.content)
                  )

                  if r.ok and r.content:
                      with open(path, "wb") as f:
                          f.write(r.content)
              except Exception as e:
                  print("下载失败:", url, str(e))
          PY

          echo ""
          echo "========== 搜索所有 JS 和 HTML 中的变量 =========="

          python - <<'PY'
          import os
          import re

          roots = [
              "/tmp/http.html",
              "/tmp/snrtv_js"
          ]

          keywords = [
              "sTV",
              "sRadio",
              "EmperorNewClothes",
              "Dressing",
              "Undress",
              "videoHashMap",
              "m3u8"
          ]

          files = []

          for root in roots:
              if not os.path.exists(root):
                  continue

              if os.path.isfile(root):
                  files.append(root)
                  continue

              for base, _, names in os.walk(root):
                  for name in names:
                      if name.lower().endswith((".js", ".html")):
                          files.append(os.path.join(base, name))

          for path in files:
              try:
                  with open(path, "r", encoding="utf-8",
                            errors="ignore") as f:
                      content = f.read()
              except Exception:
                  continue

              for keyword in keywords:
                  matches = list(
                      re.finditer(re.escape(keyword), content, re.I)
                  )

                  for match in matches[:15]:
                      start = max(0, match.start() - 300)
                      end = min(len(content), match.end() + 500)

                      print("\n==========", path, keyword, "==========")
                      print(content[start:end].replace("\n", " ")[:1000])

          PY

          echo ""
          echo "========== 专门搜索变量赋值 =========="

          grep -RInE \
            '(^|[^[:alnum:]_$])(var[[:space:]]+)?sTV[[:space:]]*=|(^|[^[:alnum:]_$])(var[[:space:]]+)?sRadio[[:space:]]*=|sTV[[:space:]]*:|sRadio[[:space:]]*:' \
            /tmp/http.html /tmp/snrtv_js 2>/dev/null | head -100 || true

          echo ""
          echo "========== 搜索 AJAX 和动态加载接口 =========="

          grep -RInE \
            'ajax|XMLHttpRequest|fetch\(|getJSON|loadScript|jsonp|sTV|sRadio' \
            /tmp/http.html /tmp/snrtv_js 2>/dev/null | head -200 || true

          echo ""
          echo "========== 搜索所有 URL =========="

          grep -RahoE \
            'https?://[^"[:space:]<>)]+' \
            /tmp/http.html /tmp/snrtv_js 2>/dev/null | sort -u | head -150 || true

          echo ""
          echo "========== 下载的 JS 文件清单 =========="
          find /tmp/snrtv_js -type f -printf '%p %s bytes\n' 2>/dev/null || true

      # 14. 执行原有抓取程序
      - name: Run fetch_stream
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 10
          max_attempts: 10
          retry_wait_seconds: 1800
          command: python ${{ github.workspace }}/fetch_streams.py

      # 15. 检查 M3U 文件
      - name: Check M3U file
        if: always()
        run: |
          echo "========== M3U 文件检查 =========="

          if [ -s ShaanxiTV.m3u ]; then
            echo "M3U 文件存在"
            wc -l ShaanxiTV.m3u
            head -20 ShaanxiTV.m3u
          else
            echo "警告：ShaanxiTV.m3u 不存在或为空"
          fi

      # 16. 提交 M3U 文件
      - name: Commit M3U file
        if: success()
        run: |
          git config --global user.email "315723172@qq.com"
          git config --global user.name "jjjay001"

          git pull --rebase origin main

          git add ShaanxiTV.m3u

          git commit -m "更新陕西广电直播源" || echo "No changes to commit"

          git push origin main
