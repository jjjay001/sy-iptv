
name: update-lives-list

on:
  schedule:
    - cron: '0 20 * * *'

  push:
    branches:
      - main
    paths:
      - '.github/workflows/update-lives-list.yml'

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-lives-list
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # 1. 拉取仓库
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. 配置 Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 3. 安装依赖
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pycryptodome requests

      # 4. 下载 stream.js
      - name: Download SNRTV stream.js
        run: |
          mkdir -p /tmp/snrtv_js/linked

          echo "========== 下载 stream.js =========="

          curl -4 -fL -sS \
            --connect-timeout 15 \
            --max-time 60 \
            --retry 5 \
            --retry-all-errors \
            -A "Mozilla/5.0" \
            "http://toutiao.cnwest.com/static/v1/stream.js" \
            -o /tmp/snrtv_js/linked/stream.js

          echo ""
          echo "========== 文件检查 =========="

          if [ ! -s /tmp/snrtv_js/linked/stream.js ]; then
            echo "错误：stream.js 下载失败"
            exit 1
          fi

          wc -c /tmp/snrtv_js/linked/stream.js

      # 5. 解密频道并生成 M3U
      - name: Decrypt SNRTV channels and generate M3U
        run: |
          cat > /tmp/generate_snrtv_m3u.py <<'PY'
          import os
          import re
          import json
          import base64
          from Crypto.Cipher import AES

          JS_PATH = "/tmp/snrtv_js/linked/stream.js"
          OUTPUT = "ShaanxiTV.m3u"

          print("========== 读取 stream.js ==========")

          if not os.path.isfile(JS_PATH):
              raise RuntimeError("找不到 stream.js")

          with open(JS_PATH, "r", encoding="utf-8", errors="ignore") as f:
              js = f.read()

          print("JS 文件大小:", len(js))

          def get_var(name):
              pattern = (
                  r'\b(?:var|let|const)\s+'
                  + re.escape(name)
                  + r'\s*=\s*["\']([^"\']+)["\']'
              )

              match = re.search(pattern, js)

              if not match:
                  raise RuntimeError("没有找到变量: " + name)

              return match.group(1)

          sTV = get_var("sTV")
          sRadio = get_var("sRadio")

          print("sTV 长度:", len(sTV))
          print("sRadio 长度:", len(sRadio))

          key = sTV[:16].encode("utf-8")
          iv = sRadio[:16].encode("utf-8")

          def decrypt(data, name):
              encrypted_text = data[16:]
              encrypted = base64.b64decode(encrypted_text)

              if len(encrypted) == 0 or len(encrypted) % 16 != 0:
                  raise RuntimeError(
                      name + " 密文长度异常: " + str(len(encrypted))
                  )

              cipher = AES.new(key, AES.MODE_CBC, iv)
              raw = cipher.decrypt(encrypted)

              # 对应 CryptoJS.pad.ZeroPadding
              raw = raw.rstrip(b"\x00")

              return raw.decode("utf-8")

          print("========== AES 解密 ==========")

          tv_text = decrypt(sTV, "sTV")
          radio_text = decrypt(sRadio, "sRadio")

          tv_data = json.loads(tv_text)
          radio_data = json.loads(radio_text)

          print("电视数据解密成功")
          print("广播数据解密成功")

          def collect_channels(data):
              result = []

              def walk(obj):
                  if isinstance(obj, dict):
                      for key_name in (
                          "m3u8", "M3U8", "url", "liveUrl"
                      ):
                          value = obj.get(key_name)

                          if (
                              isinstance(value, str)
                              and value.startswith(("http://", "https://"))
                              and ".m3u8" in value.lower()
                          ):
                              result.append(obj)
                              return

                      for value in obj.values():
                          if isinstance(value, (dict, list)):
                              walk(value)

                  elif isinstance(obj, list):
                      for item in obj:
                          walk(item)

              walk(data)

              unique = []
              seen = set()

              for item in result:
                  url = (
                      item.get("m3u8")
                      or item.get("M3U8")
                      or item.get("url")
                      or item.get("liveUrl")
                  )

                  if url and url not in seen:
                      seen.add(url)
                      unique.append(item)

              return unique

          channels = collect_channels(tv_data)

          print("========== 电视直播频道 ==========")
          print("解密出的电视直播频道数量:", len(channels))

          if not channels:
              print("电视 JSON 内容预览:")
              print(tv_text[:2000])
              raise RuntimeError(
                  "没有从电视数据中找到 m3u8 直播地址"
              )

          lines = ["#EXTM3U"]

          # 不需要写入 M3U 的频道关键词
          exclude_keywords = [
              "备用线路",
              "乐家购物",
              "移动电视"
          ]

          for index, item in enumerate(channels, 1):
              name = (
                  item.get("name")
                  or item.get("title")
                  or item.get("channelName")
                  or item.get("tvName")
                  or item.get("cname")
                  or "陕西广电频道" + str(index)
              )

              # 过滤频道
              if any(keyword in str(name) for keyword in exclude_keywords):
                  print("跳过频道:", name)
                  continue

              url = (
                  item.get("m3u8")
                  or item.get("M3U8")
                  or item.get("url")
                  or item.get("liveUrl")
              )

              name = str(name).replace('"', "'").strip()
              url = str(url).strip()

              if not url.startswith(("http://", "https://")):
                  continue

              lines.append(
                  '#EXTINF:-1 tvg-name="{}" group-title="陕西广电",{}'.format(
                      name, name
                  )
              )
              lines.append(url)

              print("{}：{}".format(name, url))

          if len(lines) <= 1:
              raise RuntimeError("过滤后没有剩余有效频道")

          with open(OUTPUT, "w", encoding="utf-8") as f:
              f.write("\n".join(lines) + "\n")

          print("")
          print("========== 生成完成 ==========")
          print("电视直播频道:", (len(lines) - 1) // 2)
          print("M3U 文件:", OUTPUT)
          print("文件大小:", os.path.getsize(OUTPUT), "bytes")

          print("")
          print(
              "广播频道数据数量:",
              len(radio_data) if isinstance(radio_data, list) else "非列表"
          )
          PY

          python /tmp/generate_snrtv_m3u.py

      # 6. 检查并提交 M3U
      - name: Commit M3U file
        run: |
          echo "========== 检查 M3U =========="

          if [ ! -s ShaanxiTV.m3u ]; then
            echo "错误：M3U 文件不存在或为空"
            exit 1
          fi

          wc -l ShaanxiTV.m3u
          cat ShaanxiTV.m3u

          echo ""
          echo "========== 配置 Git =========="

          git config user.email "315723172@qq.com"
          git config user.name "jjjay001"

          echo ""
          echo "========== 提交文件 =========="

          git add ShaanxiTV.m3u

          if git diff --cached --quiet; then
            echo "M3U 内容没有变化，无需提交"
          else
            git commit -m "更新陕西广电直播源"
          fi

          echo ""
          echo "========== 同步远程仓库 =========="

          git pull --rebase origin main

          echo ""
          echo "========== 推送更新 =========="

          git push origin main
