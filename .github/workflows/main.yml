
name: update-lives-list

on:
  schedule:
    - cron: '0 20 * * *'
  push:
    branches:
      - main
    paths:
      - 'fetch_streams.py'
      - '.github/workflows/update-lives-list.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-lives-list
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      # 1. 拉取仓库
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. 配置 Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 3. 安装依赖
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install selenium requests futures eventlet beautifulsoup4

      # 4. 测试主站 DNS
      - name: Test SNRTV DNS
        continue-on-error: true
        run: |
          echo "========== 主站 DNS =========="
          nslookup m.snrtv.com || true

      # 5. 测试主站 HTTP 和 HTTPS
      - name: Test SNRTV HTTP and HTTPS
        continue-on-error: true
        run: |
          echo "========== HTTP 测试 =========="

          curl -4 -L -sS \
            --connect-timeout 15 \
            --max-time 30 \
            "http://m.snrtv.com/snrtv_tv/index.html" \
            -o /tmp/http.html \
            -w "\nHTTP状态码: %{http_code}\n连接时间: %{time_connect}\n总时间: %{time_total}\n" || true

          echo ""
          echo "========== HTTPS 测试 =========="

          curl -4 -L -sS \
            --connect-timeout 15 \
            --max-time 30 \
            "https://m.snrtv.com/snrtv_tv/index.html" \
            -o /tmp/https.html \
            -w "\nHTTPS状态码: %{http_code}\n连接时间: %{time_connect}\n总时间: %{time_total}\n" || true

          echo ""
          echo "========== HTTP 文件检查 =========="
          ls -lh /tmp/http.html 2>/dev/null || true

      # 6. 测试静态资源 CDN 网络
      - name: Test SNRTV CDN connection
        continue-on-error: true
        run: |
          CDN_URL="http://res.cnwest.com/t/site/10001/a209bcf3e52b0593bd2c51ae47c9d6ab/assets/snrtv2020/js/EmperorNewClothes.js"

          echo "========== CDN DNS =========="
          nslookup res.cnwest.com || true

          echo ""
          echo "========== CDN IPv4 HTTP =========="

          curl -4 -v -L \
            --connect-timeout 15 \
            --max-time 30 \
            -A "Mozilla/5.0" \
            "$CDN_URL" \
            -o /tmp/cdn_test.js \
            -w "\nHTTP状态码: %{http_code}\n连接时间: %{time_connect}\n总时间: %{time_total}\n下载大小: %{size_download}\n" || true

          echo ""
          echo "========== CDN HTTPS =========="

          curl -4 -v -L \
            --connect-timeout 15 \
            --max-time 30 \
            -A "Mozilla/5.0" \
            "${CDN_URL/http:/https:}" \
            -o /tmp/cdn_test_https.js \
            -w "\nHTTPS状态码: %{http_code}\n连接时间: %{time_connect}\n总时间: %{time_total}\n下载大小: %{size_download}\n" || true

          echo ""
          echo "========== CDN 下载文件 =========="
          ls -lh /tmp/cdn_test* 2>/dev/null || true

          if [ -s /tmp/cdn_test.js ]; then
            echo ""
            echo "========== JS 文件前 20 行 =========="
            head -20 /tmp/cdn_test.js
          fi

      # 7. 下载并检查网页 JS 文件
      - name: Inspect SNRTV JavaScript
        continue-on-error: true
        run: |
          BASE="http://res.cnwest.com/t/site/10001/a209bcf3e52b0593bd2c51ae47c9d6ab/assets"

          mkdir -p /tmp/snrtv_js

          echo "========== 下载 JS 文件 =========="

          for item in \
            "snrtv2020/js/EmperorNewClothes.js" \
            "snrtv2020/js/dress.js" \
            "snrtv2020/js/Event.js" \
            "snrtv2020/js/programGuides.js" \
            "public2018/js/zepto.min.js" \
            "sxtvs2020/js/swiper.min.4.5.3.js"
          do
            filename=$(basename "$item")

            echo ""
            echo "========== $filename =========="

            curl -4 -L -sS \
              --connect-timeout 15 \
              --max-time 30 \
              -A "Mozilla/5.0" \
              "$BASE/$item" \
              -o "/tmp/snrtv_js/$filename" \
              -w "HTTP状态码: %{http_code}\n连接时间: %{time_connect}\n总时间: %{time_total}\n下载大小: %{size_download}\n" || true

            if [ -s "/tmp/snrtv_js/$filename" ]; then
              wc -c "/tmp/snrtv_js/$filename"
            else
              echo "文件下载失败或为空"
            fi
          done

          echo ""
          echo "========== 搜索频道及接口关键词 =========="

          grep -Ein \
            'ajax|api|json|channel|channelName|channelId|live|m3u8|mp4|videoBox|play|tvList|tvlist|source|url:' \
            /tmp/snrtv_js/*.js 2>/dev/null | head -200 || true

          echo ""
          echo "========== 搜索接口地址 =========="

          grep -Eo \
            'https?://[^" )]+' \
            /tmp/snrtv_js/*.js 2>/dev/null | sort -u | head -100 || true

      # 8. 检查网页 HTML
      - name: Inspect SNRTV HTML
        continue-on-error: true
        run: |
          echo "========== 页面标题 =========="
          grep -o '<title>[^<]*</title>' /tmp/http.html 2>/dev/null || true

          echo ""
          echo "========== 频道容器 =========="
          grep -Ein \
            'channelName|channelCur|videoBox|channel|m3u8|ajax' \
            /tmp/http.html 2>/dev/null | head -100 || true

          echo ""
          echo "========== 页面脚本 =========="
          grep -Ein \
            'script|channel|m3u8|ajax|api|json' \
            /tmp/http.html 2>/dev/null | tail -100 || true

          echo ""
          echo "========== HTML 前 130 行 =========="
          sed -n '1,130p' /tmp/http.html 2>/dev/null || true

      # 9. 分析陕西广电频道数据
      - name: Analyze SNRTV channel data
        continue-on-error: true
        run: |
          echo "========== 网页内嵌配置 130-185 行 =========="
          sed -n '130,185p' /tmp/http.html 2>/dev/null || true

          echo ""
          echo "========== sTV / sRadio 变量检查 =========="

          python - <<'PY'
          import re
          import os

          path = "/tmp/http.html"

          if not os.path.exists(path):
              print("主页文件不存在")
              raise SystemExit(0)

          with open(path, "r", encoding="utf-8", errors="ignore") as f:
              html = f.read()

          print("HTML 总长度:", len(html))

          for name in ("sTV", "sRadio"):
              patterns = [
                  r'\b(?:var|let|const)\s+' + name + r'\s*=\s*["\']([^"\']*)["\']',
                  r'\b' + name + r'\s*=\s*["\']([^"\']*)["\']'
              ]

              match = None

              for pattern in patterns:
                  match = re.search(pattern, html, re.S)
                  if match:
                      break

              if match:
                  value = match.group(1)
                  print("{}：找到".format(name))
                  print("{} 长度：{}".format(name, len(value)))
                  print("{} 前 40 字符：{}".format(name, value[:40]))
              else:
                  print("{}：未找到".format(name))

          PY

          echo ""
          echo "========== EmperorNewClothes.js =========="
          cat /tmp/snrtv_js/EmperorNewClothes.js 2>/dev/null || true

          echo ""
          echo "========== dress.js =========="
          cat /tmp/snrtv_js/dress.js 2>/dev/null || true

          echo ""
          echo "========== programGuides.js =========="
          cat /tmp/snrtv_js/programGuides.js 2>/dev/null || true

          echo ""
          echo "========== 频道数据关键变量 =========="
          grep -nE \
            'sTV|sRadio|videoHashMap|radioHashMap|Undress|loadScript|snr_Playlist|curPlaylist' \
            /tmp/http.html \
            /tmp/snrtv_js/*.js 2>/dev/null || true

      # 10. 执行原有抓取程序
      - name: Run fetch_stream
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 10
          max_attempts: 10
          retry_wait_seconds: 1800
          command: python ${{ github.workspace }}/fetch_streams.py

      # 11. 检查 M3U 文件
      - name: Check M3U file
        run: |
          echo "========== 检查 ShaanxiTV.m3u =========="

          if [ ! -f ShaanxiTV.m3u ]; then
            echo "M3U 文件不存在"
            exit 1
          fi

          SIZE=$(wc -c < ShaanxiTV.m3u)
          CHANNELS=$(grep -c '^#EXTINF' ShaanxiTV.m3u || true)

          echo "文件大小：$SIZE bytes"
          echo "频道数量：$CHANNELS"

          if [ "$SIZE" -eq 0 ] || [ "$CHANNELS" -eq 0 ]; then
            echo "M3U 文件为空或没有频道，停止提交"
            exit 1
          fi

          echo "M3U 文件检查通过"

      # 12. 提交 M3U 文件
      - name: Commit M3U file
        run: |
          git config user.email "315723172@qq.com"
          git config user.name "jjjay001"

          git pull --rebase origin main

          git add ShaanxiTV.m3u

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "ShaanxiTV.m3u文件"
            git push origin main
          fi
