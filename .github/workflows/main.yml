
name: update-lives-list

on:
  schedule:
    - cron: '0 20 * * *'
  push:
    branches:
      - main
    paths:
      - 'fetch_streams.py'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 1. 配置 Python 环境
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 2. 安装爬虫依赖
      - name: Install dependencies
        run: |
          pip install selenium requests futures eventlet beautifulsoup4

      # 3. 测试陕西广电网站连通性
      - name: Test SNRTV connectivity
        run: |
          echo "===== DNS解析 ====="
          nslookup m.snrtv.com

          echo "===== HTTP响应 ====="
          curl -L -v --max-time 30 \
            -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/130.0.0.0 Safari/537.36" \
            "http://m.snrtv.com/snrtv_tv/index.html" \
            -o page.html \
            -w "\nHTTP状态码: %{http_code}\n最终URL: %{url_effective}\n下载大小: %{size_download}\n"

          echo "===== 页面内容 ====="
          head -c 2000 page.html || true

      # 4. 执行 Python 抓取脚本
      - name: Run fetch_stream
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 10
          max_attempts: 10
          retry_wait_seconds: 1800
          command: python ${{ github.workspace }}/fetch_streams.py

      # 5. 将抓取生成的 m3u 文件提交保存回仓库
      - name: 提交结果
        run: |
          git config --global user.email "315723172@qq.com"
          git config --global user.name "jjjay001"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/jjjay001/sy-iptv.git
          git add .
          git commit -m "ShaanxiTV.m3u文件" || echo "No changes to commit"
          git pull --rebase origin main
          git push origin main
