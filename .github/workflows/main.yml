name: update-lives-list

on:
  schedule:
    # 北京时间每天 04:23（UTC 前一天 20:23）
    - cron: '23 20 * * *'
  push:
    branches: [main]
    paths: ['.github/workflows/update-lives-list.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-lives-list
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install --no-cache-dir pycryptodome

      - name: Download stream.js
        run: |
          mkdir -p /tmp/snrtv_js/linked
          curl -4 -fsSL --retry 3 --retry-delay 5 \
            --connect-timeout 20 --max-time 60 -A "Mozilla/5.0" \
            "https://toutiao.cnwest.com/static/v1/stream.js" \
            -o /tmp/snrtv_js/linked/stream.js \
          || curl -4 -fsSL --retry 3 --retry-delay 5 \
            --connect-timeout 20 --max-time 60 -A "Mozilla/5.0" \
            "http://toutiao.cnwest.com/static/v1/stream.js" \
            -o /tmp/snrtv_js/linked/stream.js

      - name: Decrypt and generate M3U
        run: |
          python - <<'PY'
          import json, re, base64
          from Crypto.Cipher import AES

          JS_PATH = "/tmp/snrtv_js/linked/stream.js"
          OUTPUT = "ShaanxiTV.m3u"
          EXCLUDE = ("备用线路", "乐家购物", "移动电视")
          EXTRA_CHANNELS = [
              ("西安综合", "https://xatv-yt.xiancity.cn/live/1/index.m3u8"),
              ("西安都市", "https://xatv-yt.xiancity.cn/live/2/index.m3u8"),
              ("西安影视", "https://xatv-yt.xiancity.cn/live/4/index.m3u8"),
              ("西安丝路", "https://xatv-yt.xiancity.cn/live/5/index.m3u8"),
          ]

          with open(JS_PATH, "r", encoding="utf-8", errors="ignore") as f:
              js = f.read()

          def get_var(name):
              m = re.search(rf'\b(?:var|let|const)\s+{re.escape(name)}\s*=\s*["\']([^"\']+)["\']', js)
              if not m:
                  raise RuntimeError(f"未找到变量: {name}")
              return m.group(1)

          s_tv = get_var("sTV")
          s_radio = get_var("sRadio")
          key = s_tv[:16].encode("utf-8")
          iv = s_radio[:16].encode("utf-8")

          raw = AES.new(key, AES.MODE_CBC, iv).decrypt(base64.b64decode(s_tv[16:])).rstrip(b"\x00")
          tv_data = json.loads(raw.decode("utf-8"))

          def pick_url(d):
              for k in ("m3u8", "M3U8", "url", "liveUrl"):
                  v = d.get(k)
                  if isinstance(v, str) and v.startswith(("http://", "https://")) and ".m3u8" in v.lower():
                      return v.strip()
              return None

          def pick_name(d, idx):
              for k in ("name", "title", "channelName", "tvName", "cname"):
                  v = d.get(k)
                  if v:
                      return str(v).replace('"', "'").strip()
              return f"陕西广电频道{idx}"

          channels, seen = [], set()
          def walk(obj):
              if isinstance(obj, dict):
                  u = pick_url(obj)
                  if u:
                      if u not in seen:
                          seen.add(u)
                          channels.append((pick_name(obj, len(channels) + 1), u))
                      return
                  for v in obj.values():
                      if isinstance(v, (dict, list)):
                          walk(v)
              elif isinstance(obj, list):
                  for item in obj:
                      walk(item)

          walk(tv_data)
          if not channels:
              raise RuntimeError("未解析出任何 m3u8 频道")

          lines = ["#EXTM3U"]
          snrtv_count = 0
          for name, url in channels:
              if any(kw in name for kw in EXCLUDE):
                  continue
              lines.append(f'#EXTINF:-1 tvg-name="{name}" group-title="陕西广电",{name}')
              lines.append(url)
              snrtv_count += 1

          for name, url in EXTRA_CHANNELS:
              lines.append(f'#EXTINF:-1 tvg-name="{name}" group-title="西安电视台",{name}')
              lines.append(url)

          with open(OUTPUT, "w", encoding="utf-8") as f:
              f.write("\n".join(lines) + "\n")

          print(f"生成完成: 陕西广电 {snrtv_count} 个, 西安电视台 {len(EXTRA_CHANNELS)} 个")
          PY

      - name: Commit M3U
        run: |
          test -s ShaanxiTV.m3u
          git config user.email "315723172@qq.com"
          git config user.name "jjjay001"
          git add ShaanxiTV.m3u
          if git diff --cached --quiet; then
            git commit --allow-empty -m "chore: 每日例行检查（直播源无变化）"
          else
            git commit -m "更新陕西广电直播源"
          fi
          git push origin main
