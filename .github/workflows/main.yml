
name: update-lives-list

on:
  schedule:
    - cron: '0 20 * * *'
  push:
    branches:
      - main
    paths:
      - 'fetch_streams.py'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. 拉取仓库代码
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. 配置 Python 环境
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 3. 安装爬虫依赖
      - name: Install dependencies
        run: |
          pip install selenium requests futures eventlet beautifulsoup4

      # 4. DNS 解析测试
      - name: Test SNRTV DNS
        continue-on-error: true
        run: |
          echo "===== DNS解析 ====="
          nslookup m.snrtv.com

      # 5. HTTP 和 HTTPS 连通性测试
      - name: Test SNRTV HTTP and HTTPS
        continue-on-error: true
        run: |
          echo "===== 测试 HTTP 80 ====="

          curl -v -L \
            --connect-timeout 10 \
            --max-time 20 \
            "http://m.snrtv.com/snrtv_tv/index.html" \
            -o /tmp/http.html \
            -w "\nHTTP状态码: %{http_code}\n连接时间: %{time_connect}\n总时间: %{time_total}\n" || true

          echo "===== HTTP页面内容 ====="
          if [ -f /tmp/http.html ]; then
            head -c 2000 /tmp/http.html
          fi

          echo ""
          echo "===== 测试 HTTPS 443 ====="

          curl -v -L \
            --connect-timeout 10 \
            --max-time 20 \
            "https://m.snrtv.com/snrtv_tv/index.html" \
            -o /tmp/https.html \
            -w "\nHTTPS状态码: %{http_code}\n连接时间: %{time_connect}\n总时间: %{time_total}\n" || true

          echo "===== HTTPS页面内容 ====="
          if [ -f /tmp/https.html ]; then
            head -c 2000 /tmp/https.html
          fi

      # 6. 检查网页 JavaScript 和频道接口
      - name: Inspect SNRTV scripts
        continue-on-error: true
        run: |
          echo "===== 页面标题 ====="
          grep -o '<title>[^<]*</title>' /tmp/http.html || true

          echo "===== JavaScript 文件 ====="
          grep -Eoi '<script[^>]+src="[^"]+"' /tmp/http.html || true

          echo "===== 频道接口关键词 ====="
          grep -Ein 'ajax|api|json|channel|live|m3u8|play' /tmp/http.html | head -50 || true

      # 7. 执行 Python 抓取脚本，失败后自动重试
      - name: Run fetch_stream
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 10
          max_attempts: 10
          retry_wait_seconds: 1800
          command: python ${{ github.workspace }}/fetch_streams.py

      # 8. 提交生成的 M3U 文件
      - name: 提交结果
        run: |
          git config --global user.email "315723172@qq.com"
          git config --global user.name "jjjay001"

          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/jjjay001/sy-iptv.git

          git add .

          git commit -m "ShaanxiTV.m3u文件" || echo "No changes to commit"

          git pull --rebase origin main

          git push origin main
